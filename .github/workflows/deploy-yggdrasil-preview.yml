name: Deploy YGGDRASIL preview to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "yggdrasil-preview/**"
      - ".github/workflows/deploy-yggdrasil-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp yggdrasil-preview/index.html dist/index.html
          cp yggdrasil-preview/chat.html dist/chat.html
          cp yggdrasil-preview/README-CHAT.md dist/README-CHAT.md
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
